name: Smoke Managed Vault API

on:
  push:
  pull_request:

jobs:
  smoke-managed-vault:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run managed vault API smoke
        run: python -m pytest -q tests/test_saas_main.py
