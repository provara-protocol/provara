app = "provara-managed-vault"
primary_region = "lax"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[mounts]]
  source = "provara_vault_data"
  destination = "/app/data"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
