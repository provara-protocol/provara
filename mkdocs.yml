site_name: Provara Protocol Documentation
site_url: https://provara.dev/docs/
repo_url: https://github.com/provara-protocol/provara
repo_name: provara-protocol/provara

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Introduction: getting-started.md
      - Quickstart: QUICKSTART.md
      - Comparison: COMPARISON.md
  - Tutorials:
      - Overview: tutorials/README.md
      - 01. Your First Vault: tutorials/01_first_vault.md
      - 02. Multi-Actor Dispute: tutorials/02_multi_actor_dispute.md
      - 03. Checkpoint & Query: tutorials/03_checkpoint_query.md
      - 04. MCP Integration: tutorials/04_mcp_integration.md
      - 05. Anchoring: tutorials/05_anchor.md
  - Protocol Specification:
