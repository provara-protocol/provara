      - Backpack Protocol v1.0: BACKPACK_PROTOCOL_v1.0.md
      - Chain Validation: CHAIN_VALIDATION.md
      - Offline Sync: OFFLINE_SYNC_PROTOCOL.md
      - Redaction & Shredding:
