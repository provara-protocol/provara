<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Observatory — Financial Intelligence Terminal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ======================================================================
       KESTREL DESIGN TOKENS
       ====================================================================== */
    :root {
      --k-bg: #060a10;
      --k-bg-card: #0a0e18;
      --k-bg-card-alt: #080c14;
      --k-bg-hover: #0d1220;
      --k-bg-elevated: #0e1424;
      --k-border: #111822;
      --k-border-light: #151c28;
      --k-border-hover: #1a2330;
      --k-border-accent: #1a2636;
      --k-text: #c8d4e0;
      --k-text-bright: #e0e8f0;
      --k-text-muted: #8899aa;
      --k-text-dark: #5a7088;
      --k-accent: #00e5a0;
      --k-accent-dim: #00c488;
      --k-accent-blue: #00b8ff;
      --k-accent-purple: #8866ff;
      --k-red: #ff4466;
      --k-orange: #ff8800;
      --k-yellow: #e6b84a;
      --k-sans: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --k-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
      --k-max-width: 1140px;
      --k-gutter: 20px;
    }

    /* ======================================================================
       RESET
       ====================================================================== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    /* ======================================================================
       BASE STYLES
       ====================================================================== */
    body {
      font-family: var(--k-sans);
      font-size: 16px;
      line-height: 1.6;
      color: var(--k-text);
      background: var(--k-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ======================================================================
       LAYOUT
       ====================================================================== */
    .container {
      max-width: var(--k-max-width);
      margin: 0 auto;
      padding: 0 var(--k-gutter);
    }

    /* ======================================================================
       CARD SYSTEM
       ====================================================================== */
    .card {
      background: var(--k-bg-card);
      border: 1px solid var(--k-border);
      border-radius: 8px;
      padding: 24px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--k-text-muted);
      margin-bottom: 16px;
    }

    /* ======================================================================
       LOADING STATE
       ====================================================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--k-border);
      border-top: 3px solid var(--k-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #loading-label {
      font-family: var(--k-mono);
      font-size: 0.875rem;
      color: var(--k-text-muted);
    }

    #loading-label.error {
      color: var(--k-red);
      max-width: 480px;
      text-align: center;
      line-height: 1.5;
    }

    /* ======================================================================
       APP ZONES
       ====================================================================== */
    #app {
      display: none;
      padding: 24px 0 48px;
    }

    #app > *:not(:last-child) {
      margin-bottom: 24px;
    }

    /* ---- Zone 1: Status Bar ---- */
    #zone-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--k-border);
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .status-brand {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--k-text-bright);
      letter-spacing: -0.02em;
    }
    .status-brand span { color: var(--k-accent); }
    .status-stats {
      display: flex;
      gap: 20px;
    }
    .stat {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      color: var(--k-text-muted);
    }
    .stat strong {
      color: var(--k-text);
      font-weight: 500;
    }
    .status-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .risk-badge {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .risk-low { background: rgba(0,229,160,0.15); color: var(--k-accent); border: 1px solid rgba(0,229,160,0.3); }
    .risk-medium { background: rgba(255,136,0,0.15); color: var(--k-orange); border: 1px solid rgba(255,136,0,0.3); }
    .risk-high { background: rgba(255,68,102,0.15); color: var(--k-red); border: 1px solid rgba(255,68,102,0.3); }

    /* ---- Zone 2: Macro Regime + Risk Signals ---- */
    .macro-risk-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .macro-risk-grid { grid-template-columns: 1fr; }
    }
    .regime-value {
      font-family: var(--k-mono);
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1;
      margin: 12px 0 8px;
    }
    .regime-label {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 12px;
    }
    .regime-expansion { background: rgba(0,229,160,0.15); color: var(--k-accent); }
    .regime-caution { background: rgba(255,136,0,0.15); color: var(--k-orange); }
    .regime-recession { background: rgba(255,68,102,0.15); color: var(--k-red); }
    .regime-detail {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      color: var(--k-text-muted);
      margin-top: 4px;
    }
    .risk-signals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .signal-card {
      background: var(--k-bg-card-alt);
      border: 1px solid var(--k-border-light);
      border-radius: 6px;
      padding: 16px;
    }
    .signal-name {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--k-text-muted);
      margin-bottom: 8px;
    }
    .signal-status {
      font-family: var(--k-mono);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .signal-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }
    .signal-green .signal-dot { background: var(--k-accent); box-shadow: 0 0 6px rgba(0,229,160,0.5); }
    .signal-yellow .signal-dot { background: var(--k-orange); box-shadow: 0 0 6px rgba(255,136,0,0.5); }
    .signal-red .signal-dot { background: var(--k-red); box-shadow: 0 0 6px rgba(255,68,102,0.5); }
    .signal-green .signal-label { color: var(--k-accent); }
    .signal-yellow .signal-label { color: var(--k-orange); }
    .signal-red .signal-label { color: var(--k-red); }
    .combined-score {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--k-border-light);
      font-family: var(--k-mono);
      font-size: 0.8rem;
      color: var(--k-text-muted);
      text-align: center;
    }
    .combined-score strong { font-size: 1.25rem; }

    /* ---- Zone 3: Yield Curve Monitor ---- */
    .yield-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 768px) {
      .yield-grid { grid-template-columns: 1fr; }
    }
    .chart-wrap {
      position: relative;
      height: 280px;
    }
    .chart-wrap canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ---- Zone 4: Sector Intelligence ---- */
    .sector-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 24px;
    }
    @media (max-width: 900px) {
      .sector-grid { grid-template-columns: 1fr; }
    }
    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-family: var(--k-mono);
      font-size: 0.75rem;
      border-bottom: 1px solid var(--k-border-light);
    }
    .metric-row:last-child { border-bottom: none; }
    .metric-label { color: var(--k-text-muted); }
    .metric-value { color: var(--k-text-bright); font-weight: 500; }
    .implication {
      margin-top: 16px;
      padding: 10px 12px;
      background: var(--k-bg-card-alt);
      border-left: 3px solid var(--k-accent-purple);
      border-radius: 0 4px 4px 0;
      font-size: 0.75rem;
      color: var(--k-text-muted);
      font-style: italic;
    }
    .mini-chart {
      height: 140px;
      margin: 12px 0;
    }
    .mini-chart canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* ---- Zone 5: SQL Console ---- */
    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      user-select: none;
    }
    .console-header:hover .card-title { color: var(--k-text); }
    .console-toggle {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      color: var(--k-text-muted);
      transition: transform 0.2s;
    }
    .console-body { display: none; margin-top: 16px; }
    .console-body.open { display: block; }
    .console-toggle.open { transform: rotate(180deg); }
    .sql-input {
      width: 100%;
      min-height: 80px;
      background: var(--k-bg);
      border: 1px solid var(--k-border);
      border-radius: 4px;
      color: var(--k-accent);
      font-family: var(--k-mono);
      font-size: 0.8rem;
      padding: 12px;
      resize: vertical;
      outline: none;
    }
    .sql-input:focus {
      border-color: var(--k-accent);
      box-shadow: 0 0 0 2px rgba(0,229,160,0.15);
    }
    .console-toolbar {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      align-items: center;
    }
    .btn-run {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 6px 16px;
      background: rgba(0,229,160,0.15);
      color: var(--k-accent);
      border: 1px solid rgba(0,229,160,0.3);
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-run:hover { background: rgba(0,229,160,0.25); }
    .preset-select {
      font-family: var(--k-mono);
      font-size: 0.75rem;
      padding: 6px 10px;
      background: var(--k-bg);
      color: var(--k-text-muted);
      border: 1px solid var(--k-border);
      border-radius: 4px;
      outline: none;
    }
    .console-results {
      margin-top: 12px;
      max-height: 300px;
      overflow: auto;
      font-family: var(--k-mono);
      font-size: 0.75rem;
    }
    .console-results table {
      width: 100%;
      border-collapse: collapse;
    }
    .console-results th {
      text-align: left;
      padding: 6px 10px;
      background: var(--k-bg-elevated);
      color: var(--k-accent);
      font-weight: 600;
      border-bottom: 1px solid var(--k-border);
      position: sticky;
      top: 0;
    }
    .console-results td {
      padding: 4px 10px;
      border-bottom: 1px solid var(--k-border-light);
      color: var(--k-text);
      max-width: 300px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .console-results tr:hover td { background: var(--k-bg-hover); }
    .console-error {
      color: var(--k-red);
      font-family: var(--k-mono);
      font-size: 0.8rem;
      padding: 8px;
      margin-top: 8px;
    }
    .console-info {
      color: var(--k-text-muted);
      font-family: var(--k-mono);
      font-size: 0.75rem;
      margin-top: 4px;
    }

    /* ---- Responsive ---- */
    @media (max-width: 600px) {
      .status-left { flex-direction: column; gap: 8px; }
      .status-stats { flex-wrap: wrap; }
      .risk-signals { grid-template-columns: 1fr; }
    }

    /* ---- Footer ---- */
    .footer {
      text-align: center;
      padding: 32px 0;
      font-family: var(--k-mono);
      font-size: 0.7rem;
      color: var(--k-text-dark);
      border-top: 1px solid var(--k-border);
      margin-top: 32px;
    }
  </style>
</head>
<body>

  <!-- Loading State -->
  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-label">Loading vault...</div>
  </div>

  <!-- Application -->
  <div id="app" class="container">
    <header id="zone-status"></header>
    <section id="zone-macro-risk"></section>
    <section id="zone-yield"></section>
    <section id="zone-sectors"></section>
    <section id="zone-console"></section>
    <footer class="footer">
      Provara Intelligence Terminal &middot; Data from vault.sqlite &middot; Rendered locally, no server
    </footer>
  </div>

  <!-- CDN Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

  <script>
    /* ====================================================================
       GLOBALS
       ==================================================================== */
    let DB = null;

    /* ====================================================================
       QUERY HELPERS
       ==================================================================== */

    /**
     * Execute SQL and return an array of row objects.
     * @param {string} sql - SQL statement (may include ? placeholders)
     * @param {Array} params - Bind parameters
     * @returns {Array<Object>} - Array of {column: value} objects
     */
    function query(sql, params = []) {
      const stmt = DB.prepare(sql);
      stmt.bind(params);
      const rows = [];
      while (stmt.step()) {
        rows.push(stmt.getAsObject());
      }
      stmt.free();
      return rows;
    }

    /**
     * Execute SQL and return the first value from the first row.
     * @param {string} sql - SQL statement
     * @param {Array} params - Bind parameters
     * @returns {*} - Single scalar value, or undefined if no rows
     */
    function scalar(sql, params = []) {
      const stmt = DB.prepare(sql);
      stmt.bind(params);
      let value;
      if (stmt.step()) {
        const row = stmt.getAsObject();
        const keys = Object.keys(row);
        if (keys.length > 0) {
          value = row[keys[0]];
        }
      }
      stmt.free();
      return value;
    }

    /* ====================================================================
       ZONE RENDERERS
       ==================================================================== */

    function renderStatusBar() {
      const count = scalar('SELECT COUNT(*) FROM events') || 0;
      const sources = scalar('SELECT COUNT(DISTINCT source_format) FROM events') || 0;
      const minTs = scalar('SELECT MIN(timestamp) FROM events') || '';
      const maxTs = scalar('SELECT MAX(timestamp) FROM events') || '';

      const minYear = minTs ? new Date(minTs).getFullYear() : '—';
      const maxYear = maxTs ? new Date(maxTs).getFullYear() : '—';
      const latestDate = maxTs ? new Date(maxTs).toISOString().slice(0, 10) : '—';

      const el = document.getElementById('zone-status');
      el.innerHTML = `
        <div class="status-left">
          <div class="status-brand">Provara <span>Observatory</span></div>
          <div class="status-stats">
            <div class="stat"><strong>${count.toLocaleString()}</strong> events</div>
            <div class="stat"><strong>${sources}</strong> sources</div>
            <div class="stat"><strong>${minYear}–${maxYear}</strong> span</div>
          </div>
        </div>
        <div class="status-right">
          <div class="stat">Updated ${latestDate}</div>
          <div id="combined-risk-badge" class="risk-badge risk-low">RISK: —</div>
        </div>
      `;
    }

    function renderMacroRisk() {
      /* ── Macro Regime (left card) ── */
      const spread_row = query(
        `SELECT json_extract(payload, '$.spread_2_10') as spread,
                json_extract(payload, '$.yields."2 Yr"') as y2,
                json_extract(payload, '$.yields."10 Yr"') as y10,
                timestamp
         FROM events
         WHERE source_format='treasury'
           AND json_extract(payload, '$.spread_2_10') IS NOT NULL
         ORDER BY timestamp DESC LIMIT 1`
      );

      const sr = spread_row.length ? spread_row[0] : { spread: 0, y2: 0, y10: 0, timestamp: '' };
      const spread = typeof sr.spread === 'number' ? sr.spread : parseFloat(sr.spread) || 0;
      const y2 = typeof sr.y2 === 'number' ? sr.y2 : parseFloat(sr.y2) || 0;
      const y10 = typeof sr.y10 === 'number' ? sr.y10 : parseFloat(sr.y10) || 0;
      const asOf = sr.timestamp ? new Date(sr.timestamp).toISOString().slice(0, 10) : '—';

      let regimeLabel, regimeClass, regimeColor;
      if (spread < 0) {
        regimeLabel = 'INVERTED'; regimeClass = 'regime-recession'; regimeColor = 'var(--k-red)';
      } else if (spread < 0.5) {
        regimeLabel = 'CAUTION'; regimeClass = 'regime-caution'; regimeColor = 'var(--k-orange)';
      } else {
        regimeLabel = 'EXPANSION'; regimeClass = 'regime-expansion'; regimeColor = 'var(--k-accent)';
      }

      const inversionDays = scalar(
        `SELECT COUNT(*) FROM events WHERE type='yield.inverted' AND json_extract(payload, '$.spread_2_10') < 0`
      ) || 0;

      /* ── Risk Signal: Yield Curve ── */
      let yieldSignalColor, yieldSignalLabel, yieldScore;
      if (spread < 0) {
        yieldSignalColor = 'signal-red'; yieldSignalLabel = 'INVERTED'; yieldScore = 4;
      } else if (spread < 0.5) {
        yieldSignalColor = 'signal-yellow'; yieldSignalLabel = 'FLATTENING'; yieldScore = 2;
      } else {
        yieldSignalColor = 'signal-green'; yieldSignalLabel = 'NORMAL'; yieldScore = 0;
      }

      /* ── Risk Signal: Cyber Threat ── */
      const kevRecent = scalar(
        `SELECT COUNT(*) FROM events WHERE source_format='cisa_kev' AND timestamp >= '2024-01-01'`
      ) || 0;
      const kevTotal = scalar(
        `SELECT COUNT(*) FROM events WHERE source_format='cisa_kev'`
      ) || 1;
      const kevRate = kevRecent / kevTotal;

      let cyberSignalColor, cyberSignalLabel, cyberScore;
      if (kevRate > 0.3) {
        cyberSignalColor = 'signal-red'; cyberSignalLabel = 'CRITICAL'; cyberScore = 3;
      } else if (kevRate > 0.15) {
        cyberSignalColor = 'signal-yellow'; cyberSignalLabel = 'ELEVATED'; cyberScore = 1.5;
      } else {
        cyberSignalColor = 'signal-green'; cyberSignalLabel = 'BASELINE'; cyberScore = 0;
      }

      /* ── Risk Signal: Geopolitical ── */
      const geoAvg = scalar(
        `SELECT AVG(json_extract(payload, '$.goldstein_scale')) FROM events WHERE source_format='gdelt' AND json_extract(payload, '$.goldstein_scale') IS NOT NULL`
      );
      const geoVal = typeof geoAvg === 'number' ? geoAvg : parseFloat(geoAvg) || 0;

      let geoSignalColor, geoSignalLabel, geoScore;
      if (geoVal < -3) {
        geoSignalColor = 'signal-red'; geoSignalLabel = 'HIGH'; geoScore = 2;
      } else if (geoVal < 0) {
        geoSignalColor = 'signal-yellow'; geoSignalLabel = 'ELEVATED'; geoScore = 1;
      } else {
        geoSignalColor = 'signal-green'; geoSignalLabel = 'STABLE'; geoScore = 0;
      }

      /* ── Risk Signal: Seismic ── */
      const seismicMajor = scalar(
        `SELECT COUNT(*) FROM events WHERE source_format='usgs' AND json_extract(payload, '$.magnitude') >= 6.0`
      ) || 0;

      let seismicSignalColor, seismicSignalLabel, seismicScore;
      if (seismicMajor > 0) {
        seismicSignalColor = 'signal-red'; seismicSignalLabel = 'MAJOR'; seismicScore = 1;
      } else {
        seismicSignalColor = 'signal-green'; seismicSignalLabel = 'BASELINE'; seismicScore = 0;
      }

      /* ── Combined Risk Score ── */
      const combinedRaw = yieldScore + cyberScore + geoScore + seismicScore;
      const combined = Math.min(combinedRaw, 10);
      const combinedFixed = combined.toFixed(1);

      // Update the status bar badge
      const badge = document.getElementById('combined-risk-badge');
      if (badge) {
        badge.classList.remove('risk-low', 'risk-medium', 'risk-high');
        if (combined >= 6) {
          badge.classList.add('risk-high');
          badge.textContent = `RISK: ${combinedFixed}`;
        } else if (combined >= 3) {
          badge.classList.add('risk-medium');
          badge.textContent = `RISK: ${combinedFixed}`;
        } else {
          badge.classList.add('risk-low');
          badge.textContent = `RISK: ${combinedFixed}`;
        }
      }

      /* ── Combined score color ── */
      let combinedColor;
      if (combined >= 6) combinedColor = 'var(--k-red)';
      else if (combined >= 3) combinedColor = 'var(--k-orange)';
      else combinedColor = 'var(--k-accent)';

      /* ── Render ── */
      const el = document.getElementById('zone-macro-risk');
      el.innerHTML = `
        <div class="macro-risk-grid">
          <div class="card">
            <div class="card-title">Macro Regime</div>
            <span class="regime-label ${regimeClass}">${regimeLabel}</span>
            <div class="regime-value" style="color:${regimeColor}">${spread >= 0 ? '+' : ''}${spread.toFixed(2)}%</div>
            <div class="regime-detail">2Yr ${y2.toFixed(2)}% · 10Yr ${y10.toFixed(2)}%</div>
            <div class="regime-detail">${inversionDays} inversion day${inversionDays !== 1 ? 's' : ''} recorded</div>
            <div class="regime-detail">As of ${asOf}</div>
          </div>

          <div class="card">
            <div class="card-title">Risk Signal Dashboard</div>

    function renderYieldCurve() {
      const tenors = ['1 Mo','2 Mo','3 Mo','4 Mo','6 Mo','1 Yr','2 Yr','3 Yr','5 Yr','7 Yr','10 Yr','20 Yr','30 Yr'];

      // Query latest treasury event
      const latestRow = query(`SELECT payload, timestamp FROM events WHERE source_format='treasury' ORDER BY timestamp DESC LIMIT 1`);
      // Query 6 months prior
      let priorRow = [];
      if (latestRow.length) {
        priorRow = query(
          `SELECT payload, timestamp FROM events WHERE source_format='treasury' AND timestamp <= date(?, '-6 months') ORDER BY timestamp DESC LIMIT 1`,
          [latestRow[0].timestamp]
        );
      }

      // Parse yields
      const latestPayload = latestRow.length ? JSON.parse(latestRow[0].payload) : {};
      const priorPayload = priorRow.length ? JSON.parse(priorRow[0].payload) : {};
      const latestYields = latestPayload.yields || {};
      const priorYields = priorPayload.yields || {};

      const latestData = tenors.map(t => latestYields[t] ?? null);
      const priorData = tenors.map(t => priorYields[t] ?? null);

      const latestDate = latestRow.length ? latestRow[0].timestamp.substring(0, 10) : '—';
      const priorDate = priorRow.length ? priorRow[0].timestamp.substring(0, 10) : '—';

      // Query spread history
      const spreadRows = query(
        `SELECT timestamp, json_extract(payload, '$.spread_2_10') as spread FROM events WHERE source_format='treasury' AND json_extract(payload, '$.spread_2_10') IS NOT NULL ORDER BY timestamp ASC`

      // Downsample: keep every 10th point + always keep the last
      const sampled = spreadRows.filter((r, i) => i % 10 === 0 || i === spreadRows.length - 1);

      // Set innerHTML

    function renderSectors() {

            <div class="mini-chart"><canvas id="chart-gdelt"></canvas></div>

            <div class="metric-row">
              <span class="metric-label">Dyad #${i + 1}</span>

            <div class="metric-row">

              <span class="metric-value">$${(typeof g.gdp_t === 'number' ? g.gdp_t : parseFloat(g.gdp_t) || 0).toFixed(2)}T (${g.year})</span>
            </div>`).join('')}
            <div class="implication">GDP concentration in top 3 economies exceeds 50% of monitored output — systemic coupling risk.</div>
          </div>
        </div>

      /* ── Chart: KEV Monthly (bar) ── */

      const ctxGdp = document.getElementById('chart-gdp').getContext('2d');
      const gdpLabels = gdpData.map(g => g.cc);
      const gdpValues = gdpData.map(g => typeof g.gdp_t === 'number' ? g.gdp_t : parseFloat(g.gdp_t) || 0);
      const gdpBarColors = gdpValues.map((_, i) => i === 0 ? '#00e5a0' : i === 1 ? '#00b8ff' : '#8866ff');

          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {

              ticks: {

              grid: { color: 'rgba(17,24,34,0.5)' }

            y: {
              ticks: {
                color: '#5a7088',

    /* ====================================================================
       ZONE 5: SQL CONSOLE
       ==================================================================== */

    const PRESET_QUERIES = {
      '': 'SELECT * FROM events ORDER BY seq DESC LIMIT 20',
      'Yield curve inversions': `SELECT timestamp, json_extract(payload, '$.spread_2_10') as spread,
    json_extract(payload, '$.yields."2 Yr"') as y2,
    json_extract(payload, '$.yields."10 Yr"') as y10
FROM events WHERE type='yield.inverted'
ORDER BY timestamp DESC LIMIT 50`,
      'Monthly CVE acceleration': `SELECT substr(timestamp, 1, 7) as month,
    COUNT(*) as cves_added,
    SUM(CASE WHEN type='cve.ransomware' THEN 1 ELSE 0 END) as ransomware
FROM events WHERE source_format='cisa_kev'
GROUP BY month ORDER BY month DESC LIMIT 24`,
      'GDELT conflict spikes': `SELECT substr(timestamp, 1, 7) as month,
    AVG(json_extract(payload, '$.goldstein_scale')) as avg_goldstein,
    COUNT(*) as events,
    SUM(CASE WHEN type='geopolitical.conflict' THEN 1 ELSE 0 END) as conflicts
FROM events WHERE source_format='gdelt'
GROUP BY month ORDER BY month DESC`,
      'Cross-source event density': `SELECT source_format,
    COUNT(*) as total,
    MIN(timestamp) as earliest,
    MAX(timestamp) as latest
FROM events GROUP BY source_format
ORDER BY total DESC`,
      'Top targeted vendors (KEV)': `SELECT json_extract(payload, '$.vendor') as vendor,
    COUNT(*) as vulns,
    SUM(CASE WHEN type='cve.ransomware' THEN 1 ELSE 0 END) as ransomware
FROM events WHERE source_format='cisa_kev'
GROUP BY vendor ORDER BY vulns DESC LIMIT 20`,
      'Major earthquakes': `SELECT timestamp,
    json_extract(payload, '$.magnitude') as mag,
    json_extract(payload, '$.place') as place,
    json_extract(payload, '$.depth_km') as depth_km
FROM events WHERE source_format='usgs'
  AND json_extract(payload, '$.magnitude') >= 4.5
ORDER BY json_extract(payload, '$.magnitude') DESC`,
      'GDP leaders by year': `SELECT json_extract(payload, '$.year') as year,
    json_extract(payload, '$.country_code') as code,
    json_extract(payload, '$.value_trillion') as gdp_trillion
FROM events WHERE source_format='worldbank'
  AND json_extract(payload, '$.country_code') IN ('USA','CHN','JPN','DEU','IND')
ORDER BY year DESC, gdp_trillion DESC LIMIT 50`,
    };

    function renderConsole() {
      const el = document.getElementById('zone-console');
      const presetOptions = Object.keys(PRESET_QUERIES)
        .map(k => k === '' ? '<option value="">— Presets —</option>' : `<option value="${k}">${k}</option>`)
        .join('');

      el.innerHTML = `
        <div class="card">
          <div class="console-header" onclick="toggleConsole()">
            <div class="card-title" style="margin-bottom:0">SQL Console</div>
            <span class="console-toggle" id="console-chevron">&#9660;</span>
          </div>
          <div class="console-body" id="console-body">
            <textarea class="sql-input" id="sql-input">SELECT source_format, COUNT(*) as total, MIN(timestamp) as earliest, MAX(timestamp) as latest FROM events GROUP BY source_format ORDER BY total DESC</textarea>
            <div class="console-toolbar">
              <button class="btn-run" onclick="runQuery()">Run (Ctrl+Enter)</button>
              <select class="preset-select" id="preset-select" onchange="loadPreset(this.value)">${presetOptions}</select>
            </div>
            <div id="console-output"></div>
          </div>
        </div>
      `;

      // Keyboard shortcut: Ctrl+Enter or Cmd+Enter to run
      document.getElementById('sql-input').addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
          e.preventDefault();
          runQuery();
        }
      });
    }

    function toggleConsole() {
      const body = document.getElementById('console-body');
      const chevron = document.getElementById('console-chevron');
      body.classList.toggle('open');
      chevron.classList.toggle('open');
    }

    function loadPreset(name) {
      const sql = PRESET_QUERIES[name];
      if (sql) {
        document.getElementById('sql-input').value = sql;
        runQuery();
      }
    }

    function runQuery() {
      const sql = document.getElementById('sql-input').value.trim();
      const output = document.getElementById('console-output');
      if (!sql) {
        output.innerHTML = '<div class="console-error">No SQL to execute.</div>';
        return;
      }

      const t0 = performance.now();
      try {
        const rows = query(sql);
        const elapsed = (performance.now() - t0).toFixed(1);

        if (rows.length === 0) {
          output.innerHTML = `<div class="console-info">Query returned 0 rows (${elapsed} ms)</div>`;
          return;
        }

        const displayRows = rows.slice(0, 200);
        const cols = Object.keys(displayRows[0]);

        let html = '<div class="console-results"><table><thead><tr>';
        for (const col of cols) {
          html += `<th>${col}</th>`;
        }
        html += '</tr></thead><tbody>';

        for (const row of displayRows) {
          html += '<tr>';
          for (const col of cols) {
            const val = row[col];
            if (val === null || val === undefined) {
              html += `<td style="color:var(--k-text-dark);font-style:italic">NULL</td>`;
            } else {
              const str = String(val);
              const display = str.length > 80 ? str.substring(0, 80) + '...' : str;
              html += `<td title="${str.replace(/"/g, '&quot;')}">${display}</td>`;
            }
          }
          html += '</tr>';
        }

        html += '</tbody></table></div>';
        html += `<div class="console-info">${rows.length} row${rows.length !== 1 ? 's' : ''}${rows.length > 200 ? ' (showing first 200)' : ''} &middot; ${elapsed} ms</div>`;
        output.innerHTML = html;

      } catch (err) {
        const elapsed = (performance.now() - t0).toFixed(1);
        output.innerHTML = `<div class="console-error">Error: ${err.message}</div><div class="console-info">${elapsed} ms</div>`;
      }
    }

    /* ====================================================================
       VAULT LOADER
       ==================================================================== */

    async function loadVault() {
      const label = document.getElementById('loading-label');
      const loading = document.getElementById('loading');
      const app = document.getElementById('app');

      try {
        // Step 1: Initialize SQL.js engine
        label.textContent = 'Initializing SQL engine...';
        const SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${file}`
        });

        // Step 2: Fetch and load the vault database
        label.textContent = 'Loading vault.sqlite...';
        const response = await fetch('vault.sqlite');
        if (!response.ok) {
          throw new Error(`Failed to fetch vault.sqlite: ${response.status} ${response.statusText}`);
        }
        const buf = await response.arrayBuffer();
        DB = new SQL.Database(new Uint8Array(buf));

        // Step 3: Log event count
        const eventCount = scalar('SELECT COUNT(*) FROM events');
        console.log(`Observatory: vault loaded — ${eventCount} events`);

        // Step 4: Swap loading for app
        loading.style.display = 'none';
        app.style.display = 'block';

        // Step 5: Render all zones
        renderStatusBar();
        renderMacroRisk();
        renderYieldCurve();
        renderSectors();
        renderConsole();

      } catch (err) {
        console.error('Observatory load failed:', err);
        const spinner = loading.querySelector('.spinner');
        if (spinner) spinner.style.display = 'none';
        label.classList.add('error');
        label.textContent = `Failed to load vault: ${err.message}`;
      }
    }

    /* ====================================================================
       BOOT
       ==================================================================== */
    loadVault();
  </script>
